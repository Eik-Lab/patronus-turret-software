dataset:
  root: ./data/drone
  train_images: train
  train_annotations: train/_annotations.coco.json
  val_images: valid
  val_annotations: valid/_annotations.coco.json

model:
  type: dfine
  name: ustc-community/dfine-medium-coco

training:
  output_dir: ./runs/dfine_medium
  tensorboard_dir: ./runs/dfine_medium/tb
  epochs: 50
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_ratio: 0.0
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  optimizer: adamw_torch
  image_size: 640
  num_workers: 4
  logging_steps: 10
  save_total_limit: 3
  seed: 42
  augment: true
