dataset:
  root: /home/frederic/Documents/patronus-turret-software/model_training/repository_location/option_A_half_total
  train_images: train
  train_annotations: train/annotations.json
  val_images: val
  val_annotations: val/annotations.json

model:
  type: dfine
  name: ustc-community/dfine-large-coco

training:
  output_dir: ./runs/dfine_large
  tensorboard_dir: ./runs/dfine_large/tb
  epochs: 25
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  optimizer: adamw_torch
  image_size: 640
  num_workers: 4
  logging_steps: 10
  save_total_limit: 1
  seed: 42
  augment: true
  early_stopping_patience: 10
