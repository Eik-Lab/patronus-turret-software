[project]
name = "model-training"
version = "0.1.0"
description = "Patronus object-detection training (COCO/YOLO datasets, HuggingFace + Ultralytics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "matplotlib",
    "numpy",
    "albumentations",
    "torch",
    "torchvision",
    "transformers>=5.0",
    "accelerate>=1.1.0",
    "torchmetrics",
    "tensorboard",
    "pycocotools",
    "roboflow",
    "python-dotenv",
    "ultralytics",
    "onnx",
    "onnxruntime",
    "onnxslim",
]

[project.scripts]
patronus = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"train.py" = "train.py"

[dependency-groups]
dev = []
