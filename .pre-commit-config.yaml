default_stages: [pre-commit]
exclude: ^deps/
repos:
  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: treefmt --fail-on-change
        language: system
        files: '\.(nix|c|cc|cpp|h|cu|cuh|cmake)$|(^|/)CMakeLists\.txt$'
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy --fix -p build
        language: system
        types_or: [c, c++, objective-c]
        # Tests are only in the replay build's compile database.
        exclude: ^tools/
      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        files: '\.nix$'
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system
        types: [text]
