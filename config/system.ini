[general]
# Run mode: both, rgb, mono
mode=both
# Disable tracking by default for inference-only mode
tracking=false

[sensor]
# Sensor module for distance and GPS data
enabled=true
port=/dev/ttyACM0
baud_rate=B115200

[can]
# Shared CAN bus settings for all gimbals
datarate=1
pds_node_id=100

[can_1]
# Gimbal 1 (tower 1)
pan_node_id=16
tilt_node_id=18
max_velocity_rad_s=6.28
tilt_max_rad=0.523

[can_2]
# Gimbal 2 (tower 2)
pan_node_id=28
tilt_node_id=15
max_velocity_rad_s=6.28
tilt_max_rad=0.523

[tracking_1]
# Gimbal 1 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5
# --- Target filter (kalman-cpp constant-acceleration tracker) ---
filter_enabled=true
# The filter steps once per camera frame, on the camera's capture clock.
# Detection centroid sigma, px. Larger trusts the detector's box centre less and
# smooths its frame-to-frame jitter more; too small and updates get rejected.
filter_meas_sigma_px=8.0
# White-jerk spectral density, px^2/s^5 -- the knob that matters. Acceleration
# can change by sqrt(q*T) px/s^2 within T seconds. Higher follows manoeuvres
# faster and passes more jitter through.
filter_q_jerk=200000
# Innovation gate, chi^2 (2 dof). 9.21 = 99%.
filter_gate=9.21
# Low-confidence detections are trusted less: position variance is scaled by
# 1 + filter_conf_noise_scale * (1 - confidence).
filter_conf_noise_scale=10.0
# Drop the track after this long without an accepted detection, ms, so the next
# detection re-seeds the filter. 0 = never.
filter_max_coast_ms=1000
# Tracking-loop tick, ms: how often the motors are serviced. Not the filter rate.
filter_tick_ms=10
# Age of a frame when it reaches the tracking loop, in ms. Used to look up the
# gimbal encoder angle at capture, and as part of how far the estimate is
# extrapolated before the control law acts on it.
filter_pipeline_latency_ms=20
# --- Control law (PD + lead) ---
kp=0.006
kd=0.0
lead_gain=0.0

[tracking_2]
# Gimbal 2 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5
# Filter and control settings mirror [tracking_1]; copy them across when tuning.

[rgb]
camera_serial=41882813
camera_caps=video/x-raw(memory:NVMM),format=YUY2,width=4200,height=2160
infer_config=config/deepstream/config_infer_primary_rgb.txt
udp_host=123.69.69.53
udp_port=5001
encoder_bitrate=3000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
# and not automatically the muxed size. Verify with:
#   ./inference --calibrate-focal
# A ratio of ~3.00 in the report means the real space is 640x640, not 1920x1088.
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian. Measure with --calibrate-focal.
# The filter removes the gimbal's own motion using these and the encoders; both
# must be non-zero, otherwise camera motion is not compensated at all.
focal_x_px=0
focal_y_px=0
# Draw the filter's prediction on the video overlay: red ring on the estimate,
# blue velocity arrow, yellow 3-sigma ellipse, and a green dot on each detection
# the filter accepts. Cosmetic only —
# the motors are commanded identically whether this is on or off.
draw_predictions=true
# Visualisation horizon for the drawn velocity arrow, seconds. Deliberately separate
# from the per-gimbal lead_gain, which is a control-law parameter: tuning one
# must not silently redraw the other.
prediction_lead_s=0.15

[mono]
camera_serial=41882812
camera_caps=video/x-raw(memory:NVMM),format=GRAY8,width=4096,height=3000
infer_config=config/deepstream/config_infer_primary_yolov8.txt
udp_host=123.69.69.53
udp_port=5000
encoder_bitrate=5000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
# and not automatically the muxed size. Verify with:
#   ./inference --calibrate-focal
# A ratio of ~3.00 in the report means the real space is 640x640, not 1920x1088.
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian. Measure with --calibrate-focal.
# The filter removes the gimbal's own motion using these and the encoders; both
# must be non-zero, otherwise camera motion is not compensated at all.
focal_x_px=0
focal_y_px=0
draw_predictions=true
prediction_lead_s=0.15
