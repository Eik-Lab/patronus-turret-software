[general]
# Run mode: both, rgb, mono
mode=both
# Disable tracking by default for inference-only mode
tracking=true
# Minimum level written to stdout and patronus.log:
# debug, info, warning, error, critical. Sensor readings and pipeline
# start/stop chatter are Info, so "info" makes the turret noticeably chatty.
log_level=warning

[sensor]
# Sensor module for distance and GPS data
enabled=true
port=/dev/ttyACM2
baud_rate=B115200

[commands]
# UDP listener for control commands (e.g. "shoot") from the client console
enabled=true
command_host=0.0.0.0
command_port=5002

[shoot_controller]
port=/dev/ttyACM1
baud_rate=B9600

[can]
# Shared CAN bus settings for all gimbals
datarate=1
pds_node_id=100

[can_1]
# Gimbal 1 (tower 1)
pan_node_id=107
tilt_node_id=757
max_velocity_rad_s=6.28
tilt_max_rad=0.523
# Drive both axes into their physical end stops at startup to find software
# limits (blocking, ~1 min per gimbal). After the sweep each axis parks at the
# centre of its range, which becomes home. Axes that fail calibration keep
# their start pose as home.
calibrate_on_boot=true
# Velocity-PID gains, per axis (MD* modeVELOCITY_PID)
pan_kp=15
pan_ki=2.5
pan_kd=0
pan_integral_max=20
tilt_kp=2
tilt_ki=0.0
tilt_kd=0
tilt_integral_max=10

[can_2]
# Gimbal 2 (tower 2)
pan_node_id=97
tilt_node_id=758
max_velocity_rad_s=6.28
tilt_max_rad=0.523
# See the note in [can_1]
calibrate_on_boot=true
# Velocity-PID gains, per axis (MD* modeVELOCITY_PID)
pan_kp=10
pan_ki=0.5
pan_kd=0
pan_integral_max=10
tilt_kp=2
tilt_ki=0.0
tilt_kd=0
tilt_integral_max=20

[tracking_1]
# Gimbal 1 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5

# Kalman filter
filter_enabled=true
# Detection centroid sigma. Larger trusts the detector's box centre less and
# smooths its frame-to-frame jitter more; too small and updates get rejected.
filter_meas_sigma_px=8.0
# White-jerk spectral density, px^2/s^5 -- the knob that matters. Acceleration
# can change by sqrt(q*T) px/s^2 within T seconds. Higher follows manoeuvres
# faster and passes more jitter through.
filter_q_jerk=200000
# Innovation gate, chi^2 (2 dof). 9.21 = 99%.
filter_gate=9.21
# Low-confidence detections are trusted less: position variance is scaled by
# 1 + filter_conf_noise_scale * (1 - confidence).
filter_conf_noise_scale=10.0
# Drop the track after this long
filter_max_coast_ms=1000
# Tracking-loop tick, ms
filter_tick_ms=10
# Age of a frame when it reaches the tracking loop, in ms.
filter_pipeline_latency_ms=20
# --- Control law (PD + lead) ---
kp=0.006
kd=0.0
lead_gain=0.0

[tracking_2]
# Gimbal 2 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5
# Filter and control settings mirror [tracking_1]; copy them across when tuning.

[rgb]
camera_serial=41882813
camera_caps=video/x-raw(memory:NVMM),format=YUY2,width=4200,height=2160
infer_config=config/deepstream/config_infer_primary_rgb.txt
udp_host=123.69.69.53
udp_port=5001
encoder_bitrate=3000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian. Compute it from the lens and
# sensor specs:
# TODO: these values should not be 0
focal_x_px=1000
focal_y_px=1000
draw_predictions=true
# Visualisation horizon for the drawn velocity arrow, seconds
prediction_lead_s=0.15

[mono]
camera_serial=41882812
camera_caps=video/x-raw(memory:NVMM),format=GRAY8,width=4096,height=3000
infer_config=config/deepstream/config_infer_primary_yolov8.txt
udp_host=123.69.69.53
udp_port=5000
encoder_bitrate=5000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian. Compute it from the lens and
# sensor specs:
# TODO: these values should not be 0
focal_x_px=1000
focal_y_px=1000
draw_predictions=true
prediction_lead_s=0.15
