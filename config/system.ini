[general]
# Run mode: both, rgb, mono
mode=both
# Disable tracking by default for inference-only mode
tracking=true
# Minimum level written to stdout and patronus.log:
# debug, info, warning, error, critical. Sensor readings and pipeline
# start/stop chatter are Info, so "info" makes the turret noticeably chatty.
log_level=warning

[telemetry]
# Per-run CSV logs of every camera frame (detection, filter estimate, timing)
# and every tracking tick (encoder pose, aim error, motor command), written to
# <dir>/<date-time>/ for tuning. Summarise a run with
#   python3 tools/telemetry_analyse.py telemetry/<run>
# Roughly 2 MB per minute of tracking.
enabled=true
dir=telemetry

[sensor]
# Sensor module for distance and GPS data
enabled=true
port=/dev/ttyACM0
baud_rate=B115200

[commands]
# UDP listener for control commands (e.g. "shoot") from the client console
enabled=true
# Local address to bind on (this Jetson), not the client's address.
# 0.0.0.0 accepts commands on every interface.
command_host=0.0.0.0
command_port=5002

[can]
# Shared CAN bus settings for all gimbals
datarate=1
pds_node_id=100

[can_1]
# Gimbal 1 (tower 1): carries both cameras and tracks from the mono one
pan_node_id=107
tilt_node_id=757
max_velocity_rad_s=6.28
tilt_max_rad=0.523
# Drive both axes into their physical end stops at startup to find software
# limits (blocking, ~1 min per gimbal). After the sweep each axis parks at the
# centre of its range, which becomes home. Axes that fail calibration keep
# their start pose as home.
calibrate_on_boot=true
# Velocity-PID gains, per axis (MD* modeVELOCITY_PID). Tuned on the hardware
# against stiction: at the old pan 15/2.5 and tilt 2/0 the pan axis did not
# move at all below 0.1 rad/s and tilt reached a fifth of a 0.05 rad/s command,
# so small tracking corrections did nothing until the error grew and the axis
# broke loose and ran past. Now pan reaches ~82% of 0.05 rad/s and ~92% of
# 0.1, tilt ~74% and ~86%, with no added wobble at standstill (< 0.6 mrad).
# Tilt (direct drive, 50 Hz torque bandwidth) wobbles at kp >= 4.
pan_kp=120
pan_ki=800
pan_kd=0
pan_integral_max=20
tilt_kp=3
tilt_ki=15
tilt_kd=0
tilt_integral_max=10
# Output shaping, per axis: every velocity command is multiplied by the
# scale, then clamped to +/- the axis max (rad/s; capped at max_velocity_rad_s).
pan_velocity_scale=0.05
tilt_velocity_scale=0.05
pan_max_velocity_rad_s=3.0
tilt_max_velocity_rad_s=1.5

[can_2]
# Gimbal 2 (tower 2): the pointer. It carries no camera, so it follows the
# target bearing reported by [can_1]'s camera instead of running its own image
# loop. Needs focal_x_px/focal_y_px set on that camera to turn pixels into angles.
follow=1
# P-gain toward the target bearing, rad/s per rad of error
follow_gain=5.0
# Pointer home minus camera home, when both point at the same spot. Bearings are
# measured from each gimbal's home (the centre of its calibrated range).
pan_offset_rad=0.0
tilt_offset_rad=0.0
pan_node_id=97
tilt_node_id=758
max_velocity_rad_s=6.28
tilt_max_rad=0.523
# See the note in [can_1]
calibrate_on_boot=true
# Velocity-PID gains, per axis (MD* modeVELOCITY_PID)
pan_kp=10
pan_ki=0.5
pan_kd=0
pan_integral_max=10
tilt_kp=2
tilt_ki=0.0
tilt_kd=0
tilt_integral_max=20
# Output shaping, see the note in [can_1]
pan_velocity_scale=0.05
tilt_velocity_scale=0.05
pan_max_velocity_rad_s=3.0
tilt_max_velocity_rad_s=1.5

[tracking_1]
# Gimbal 1 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5

# Kalman filter
filter_enabled=true
# Detection centroid sigma. Larger trusts the detector's box centre less and
# smooths its frame-to-frame jitter more; too small and updates get rejected.
# Measured on the mono camera (20261023-132448): ~12 px horizontal and ~3 px
# vertical jitter with the gimbal still, up to ~28 / 8 px slewing fast.
filter_meas_sigma_px=10.0
# White-jerk spectral density, px^2/s^5 -- the knob that matters. Acceleration
# can change by sqrt(q*T) px/s^2 within T seconds. Higher follows manoeuvres
# faster and passes more jitter through.
filter_q_jerk=20000
# Innovation gate, chi^2 (2 dof). 9.21 = 99%, 13.8 = 99.9%.
filter_gate=13.8
# Low-confidence detections are trusted less: position variance is scaled by
# 1 + filter_conf_noise_scale * (1 - confidence).
filter_conf_noise_scale=2.0
# Drop the track after this long
filter_max_coast_ms=300
# Tracking-loop tick, ms
filter_tick_ms=10
# Age of a frame when it reaches the tracking loop, in ms. Fallback only: the
# pipeline measures each frame's age from its PTS (logged once at startup at
# log_level=info) and uses that whenever it can.
filter_pipeline_latency_ms=20
# Furthest ahead of the frame the target's motion is predicted, ms: the frame's
# age at the control instant plus the actuation latency, capped here. Covers
# the full age, so a moving drone is aimed at where it is now rather than where
# it was when the frame was taken. Lower it if the aim runs ahead of the
# detections. The gimbal's rotation since the frame is measured, never capped.
filter_max_lead_ms=300
# How long the gimbal keeps turning at its current rate after a command, ms
# (drive velocity loop, inertia, stiction break-loose). The aim error is taken
# where the gimbal will be by then, so the command eases off before the camera
# reaches the target instead of after. Still overshoots: raise it. Creeps in
# slowly or hunts at a low rate: lower it. 0 aims at the current pose.
# Measured (20261023-132448): pan 8 ms dead time + 10 ms lag.
filter_actuation_latency_ms=20
# --- Control law (PD + lead) ---
# Normalised command per pixel of aim error. The loop gain in 1/s is
#   kp * max_velocity_rad_s * velocity_scale * focal_px
# so it depends on the camera tracked from: 0.0025 gives ~10/s pan and ~8/s
# tilt on mono (was 0.006: ~24/s, which overshoots). Re-derive it when changing
# camera, velocity_scale or max_velocity_rad_s.
kp=0.0025
kd=0.0
lead_gain=0.0

[tracking_2]
# Gimbal 2 home-return behaviour
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5
# Filter and control settings mirror [tracking_1]; copy them across when tuning.

[rgb]
camera_serial=41882813
camera_caps=video/x-raw(memory:NVMM),format=YUY2,width=4200,height=2160
infer_config=config/deepstream/config_infer_primary_rgb.txt
udp_host=123.69.69.53
udp_port=5001
encoder_bitrate=3000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian, from the lens and sensor specs:
#   focal_px = lens_mm / pixel_pitch_mm * detection_size / capture_size
# Basler 12 mm lens on a Gpixel GMAX2509 (2.5 um pixels): 4800 px native. The
# muxer stretches the 4200x2160 capture to 1920x1088 without padding, so the
# scale differs per axis. Nominal values; refine by panning across a static
# scene and dividing the pixel shift by the encoder angle.
focal_x_px=2194.3
focal_y_px=2417.8
# Sensor readout + USB transfer after exposure, ms. pylonsrc stamps frames on
# arrival, so this plus half the exposure is how much older the image is.
# 0 = auto: frame bytes / 360 MB/s (4200x2160 YUY2: ~50 ms). Measured on this
# camera against its latched clock: 47.4 ms (exposure start to retrieval 52.4 ms
# at 5 ms exposure).
readout_ms=47.4
draw_predictions=true
# Visualisation horizon for the drawn velocity arrow, seconds
prediction_lead_s=0.15

[mono]
camera_serial=41882812
# 2x2 sensor binning (below): 4096x3000 -> 2048x1500, same field of view, a
# quarter of the USB traffic. The detector only sees 1920x1088 either way.
camera_caps=video/x-raw(memory:NVMM),format=GRAY8,width=2048,height=1500
infer_config=config/deepstream/config_infer_primary_yolov8.txt
udp_host=123.69.69.53
udp_port=5000
encoder_bitrate=5000
muxer_width=1920
muxer_height=1088
# Pixel space the detector reports boxes in. NOT the network input (640x640)
detection_width=1920
detection_height=1088
# Focal length in DETECTION pixels per radian, see the note in [rgb].
# Basler 75 mm lens on a Sony IMX545 (2.74 um pixels): 27372 px native,
# with the 4096x3000 capture stretched to 1920x1088 -> 12830.7 / 9927.0 on
# paper. Fitted from telemetry 20261023-132448 (stationary drone, 64 tracks):
# 4% and 3% lower.
focal_x_px=12317.5
focal_y_px=9629.2
# See the note in [rgb]. Auto: 4096x3000 GRAY8 -> ~34 ms; a bench measurement
# gave 33.5 ms. But telemetry 20261023-132448 shows the images are a constant
# 232 ms older than that (both axes agree, steady across the run): about seven
# frames queue before pylonsrc retrieves them, as the camera and the pipeline
# both run at ~28 fps and a backlog never drains. That was corrected here with
# readout_ms=265 at full resolution; binning and grab_buffers below remove the
# queue instead, so this is back to auto (~8.5 ms for 2048x1500) until a
# stationary-drone run re-measures it: tools/telemetry_analyse.py --stationary.
readout_ms=0
# Sensor binning factor, both axes. Sums pixels, so the image is ~4x brighter:
# exposure needs ~4x less.
binning=2
# Frames the Pylon grabber may hold (default 16). Few, so frames are dropped
# rather than queued when the pipeline falls behind.
grab_buffers=3
draw_predictions=true
prediction_lead_s=0.15
