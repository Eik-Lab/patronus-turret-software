[general]
# both, rgb or mono
mode=mono
# Drive the motors. With false the filter still runs for the overlay.
tracking=true
# debug, info, warning, error or critical. info is chatty.
log_level=warning

[telemetry]
# Per-run CSVs of every frame and tick in <dir>/<date-time>/, ~2 MB/min.
# Summarise with: python3 tools/telemetry_analyse.py telemetry/<run>
enabled=true
dir=telemetry

[sensor]
# Rangefinder and GPS; readings are only logged so far.
enabled=true
port=/dev/ttyACM0
baud_rate=B115200

[commands]
# UDP control commands from the client console.
enabled=true
# Local address to bind, not the client's.
command_host=0.0.0.0
command_port=5002

[can]
# Mbps: 1, 2, 5 or 8
datarate=1
# Power distribution module; 0 for none.
pds_node_id=100

[can_1]
# Tower 1, carries both cameras.
# rgb or mono; unset round-robins. Per-camera gains are in [tracking_1.*].
camera=mono
pan_node_id=107
tilt_node_id=757
# Full-scale output of the control law, rad/s.
max_velocity_rad_s=6.28
# Only logged; boot calibration sets the real limits.
tilt_max_rad=0.523
# Find soft limits by driving into the end stops at startup (~1 min), then
# park at the centre, which becomes home.
calibrate_on_boot=true
# The drives' own velocity PID. High gains to beat stiction: at pan 15/2.5,
# tilt 2/0 small commands did nothing until the axis broke loose and overshot.
# Tilt wobbles at kp >= 4.
pan_kp=120
pan_ki=800
pan_kd=0
pan_integral_max=20
tilt_kp=3
tilt_ki=15
tilt_kd=0
tilt_integral_max=10
# Every command is multiplied by the scale, then clamped to the axis max.
pan_velocity_scale=0.05
tilt_velocity_scale=0.05
pan_max_velocity_rad_s=3.0
tilt_max_velocity_rad_s=1.5

[can_2]
# Tower 2, the pointer. No camera: aims at the bearing [can_1]'s camera
# reports, which needs that camera's focal lengths.
follow=1
# rad/s per rad of bearing error
follow_gain=5.0
# Pointer home minus camera home, when both point at the same spot.
pan_offset_rad=0.0
tilt_offset_rad=0.0
pan_node_id=97
tilt_node_id=758
max_velocity_rad_s=6.28
tilt_max_rad=0.523
calibrate_on_boot=true
pan_kp=10
pan_ki=0.5
pan_kd=0
pan_integral_max=10
tilt_kp=2
tilt_ki=0.0
tilt_kd=0
tilt_integral_max=20
pan_velocity_scale=0.05
tilt_velocity_scale=0.05
pan_max_velocity_rad_s=3.0
tilt_max_velocity_rad_s=1.5

# [tracking_N.rgb] and [tracking_N.mono] override [tracking_N] for that camera.
[tracking_1]
home_return_enabled=true
# rad/s per rad of error
home_return_gain=2.0
home_tolerance_rad=0.05
# Hold this long after losing the target before heading home.
home_return_delay_ms=500
home_return_max_velocity=1.5

# Manual mode, entered from the client console. Speed as a fraction of the
# control law's full scale: max_velocity_rad_s * velocity_scale * this.
manual_speed=0.25
# A move stops this long after its last command; must exceed the key repeat
# interval. The first press is a short nudge until the client's repeat starts.
manual_timeout_ms=150

filter_enabled=true
# chi^2 with 2 dof: 9.21 = 99%, 13.8 = 99.9%.
filter_gate=13.8
# Position variance is scaled by 1 + this * (1 - confidence).
filter_conf_noise_scale=2.0
# Drop the track after this long without an accepted detection.
filter_max_coast_ms=300
filter_tick_ms=10
# Fallback for frames without a PTS; normally the age is measured.
filter_pipeline_latency_ms=20
# Cap on extrapolating the target's motion. Lower it if the aim runs ahead.
filter_max_lead_ms=300
# How long the gimbal keeps turning after a command. Overshoots: raise it.
# Hunts slowly: lower it. Measured 8 ms dead time + 10 ms lag (20261023-132448).
filter_actuation_latency_ms=20
kd=0.0
lead_gain=0.0

# filter_meas_sigma_px  detection centre noise, 1 sigma.
# filter_q_jerk         px^2/s^5, the main knob: higher follows manoeuvres
#                       faster but passes more jitter. Scales with focal^2.
# kp                    loop gain in 1/s is
#                       kp * max_velocity_rad_s * velocity_scale * focal_px
[tracking_1.mono]
# Jitter ~12 / 3 px still, up to ~28 / 8 px slewing (20261023-132448).
filter_meas_sigma_px=10.0
filter_q_jerk=20000
# ~10/s pan, ~8/s tilt. 0.006 overshot.
kp=0.0025

[tracking_1.rgb]
# Jitter ~4 / 5 px on a hovering target (20261028-162354).
filter_meas_sigma_px=6.0
filter_q_jerk=4000
# ~8/s pan, ~10/s tilt. 0.014 hunted at 1.4 Hz. Below mono because rgb frames
# are older and slower.
kp=0.006

# Filter and control settings: copy from [tracking_1] when tuning.
[tracking_2]
home_return_enabled=true
home_return_gain=2.0
home_tolerance_rad=0.05
home_return_delay_ms=500
home_return_max_velocity=1.5

[rgb]
enabled=false
camera_serial=41882813
# Host-memory capture avoids the observed dual-camera NVMM/Thor stall.
# Root cause is unconfirmed; downstream conversion and encoding still use NVMM.
camera_caps=video/x-raw,format=YUY2,width=4200,height=2160
infer_config=config/deepstream/config_infer_primary_rgb.txt
udp_host=123.69.69.53
udp_port=5001
# thor selects NVMM hardware H.264; x264 is the explicit software alternative
# and the fallback configuration value when this key is omitted (not runtime fallback).
# Thor needs nvv4l2h264enc/h264parse and Thor tuning properties. Real footage,
# receiver compatibility and end-to-end latency acceptance remain outstanding.
# Both backends take bitrate in kbps; Thor uses CBR, High, GOP 60 and no B frames.
encoder_backend=thor
encoder_bitrate=3000
muxer_width=1920
muxer_height=1088
# The space boxes are reported in, not the network input.
detection_width=1920
detection_height=1088
# Detection pixels per radian. Measured with tools/focal_calib_analyse.py.
# The 12 mm lens predicts 2194 / 2418, but the image moves ~2.1x that, as if
# the lens were ~25 mm (20261028-162354). Check the lens.
focal_x_px=4470.0
focal_y_px=5360.0
# Readout + USB transfer after exposure; 0 estimates it from the caps.
# Measured against the camera's clock.
readout_ms=47.4
draw_predictions=true
# Length of the drawn velocity arrow, seconds.
prediction_lead_s=0.15

[mono]
enabled=true
camera_serial=41882812
# Binned 2x2 from 4096x3000: same field of view, a quarter of the USB traffic.
# Host-memory capture: see the observed-stall workaround in [rgb].
camera_caps=video/x-raw,format=GRAY8,width=2048,height=1500
infer_config=config/deepstream/config_infer_primary_yolov8.txt
udp_host=123.69.69.53
udp_port=5000
# See [rgb] for backend constraints; both cameras select hardware encoding.
encoder_backend=thor
encoder_bitrate=5000
muxer_width=1920
muxer_height=1088
detection_width=1920
detection_height=1088
# 3-4% below the 75 mm lens spec, fitted from 20261023-132448.
focal_x_px=12317.5
focal_y_px=9629.2
# Auto until re-measured with telemetry_analyse.py --stationary. Frames used
# to queue ~232 ms in the grabber; binning and grab_buffers removed that.
readout_ms=0
# Sums pixels, so exposure needs ~4x less.
binning=2
# Few buffers, so frames are dropped rather than queued when behind.
grab_buffers=3
draw_predictions=true
prediction_lead_s=0.15
